# query_patch_sweep.yaml
program: scripts/training_pipeline/execute_pipeline.py
project: master

method: bayes

metric:
  name: best_val_loss
  goal: minimize

parameters:
  model:
    value: query_patch

  interaction-loss-lambda:
    value: 0.5
  
  loss-type:
    value: sparsity_21

  trainable-final-slope:
    value: true

  max-pooling:
    value: true
  
  int-mod-type:
    values: [max, normal]

  num-interaction-queries:
    values: [8, 16, 32, 64]
  
  query-heads:
    values: [2, 4, 5, 10]
  
  query-layers:
    values: [1, 2, 3]
  
  query-dropout:
    distribution: uniform
    min: 0.0
    max: 0.3
  
  query-contact-bias-init:
    distribution: uniform
    min: -7.5
    max: -5.5
  
  max-epochs:
    value: 97

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - scripts.training_pipeline.execute_pipeline
  - ${args_no_boolean_flags}
