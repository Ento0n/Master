# query_patch_sweep.yaml
program: scripts/training_pipeline/execute_pipeline.py
project: master

method: bayes

metric:
  name: best_val_contact_auprc_macro
  goal: maximize

parameters:
  model:
    value: query_patch

  interaction-loss-lambda:
    value: 0.5
  
  loss-type:
    values: [contact, sparsity_11, sparsity_21, sparsity_12, sparsity_22]

  trainable-final-slope:
    value: true

  max-pooling:
    value: true
  
  int-mod-type:
    values: [max, normal]

  num-interaction-queries:
    values: [8, 16, 32, 64]
  
  query-heads:
    values: [2, 4, 5, 10, 20]
  
  query-layers:
    values: [1, 2, 3, 5, 10]
  
  query-dropout:
    distribution: uniform
    min: 0.0
    max: 0.8
  
  query-contact-bias-init:
    distribution: uniform
    min: -7.5
    max: -5.5
  
  compatibility-rank:
    values: [16, 32, 64, 128]

  compatibility-scale:
    values: [0, 1, 2, 5, 10, 20]
  
  max-epochs:
    value: 95

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - scripts.training_pipeline.execute_pipeline
  - ${args_no_boolean_flags}
