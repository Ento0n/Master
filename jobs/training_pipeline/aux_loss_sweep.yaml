# balanced_bce_sweep.yaml
program: scripts/training_pipeline/execute_pipeline.py
project: master

method: grid

metric:
  name: best_val_contact_auprc_macro
  goal: maximize

parameters:
  model:
    value: query_patch
  
  loss-type:
    value: balanced_bce

  query-interface-loss-weight:
    values: [0.0, 0.05, 0.2, 0.5, 1.0]

  interface-omega:
    value: 0.2

  omega:
    values: [0.02, 0.05, 0.1, 0.2, 0.5]
  
  max-epochs:
    value: 91

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - scripts.training_pipeline.execute_pipeline
  - ${args_no_boolean_flags}
