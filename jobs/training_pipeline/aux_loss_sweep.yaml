# balanced_bce_sweep.yaml
program: scripts/training_pipeline/execute_pipeline.py
project: master

method: grid

metric:
  name: best_val_loss
  goal: minimize

parameters:
  model:
    value: query_patch
  
  loss-type:
    value: balanced_bce

  query-gate-loss-weight:
    values: [0.0, 0.05, 0.2, 0.5]

  query-gate-bias-init:
    values: [-2.0, 0.0]
  
  max-epochs:
    value: 92

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - scripts.training_pipeline.execute_pipeline
  - ${args_no_boolean_flags}