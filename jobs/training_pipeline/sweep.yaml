# sweep.yaml
program: scripts/training_pipeline/execute_pipeline.py
project: master

method: bayes

metric:
  name: best_val_contact_auprc_macro
  goal: maximize

parameters:
  model:
    value: dscript

  interaction-loss-lambda:
    value: 0.5
  
  loss-type:
    value: sparsity_21
  
  int-mod-type:
    value: normal
  
  max-pooling:
    values: [true, false]
  
  negative-contact-maps:
    values: [true, false]

  trainable-final-slope:
    values: [true, false]

  gamma-init:
    distribution: uniform
    min: 0.0
    max: 5.0
  
  max-epochs:
    value: 98
  
command:
  - ${env}
  - ${interpreter}
  - "-m"
  - scripts.training_pipeline.execute_pipeline
  - ${args_no_boolean_flags}
