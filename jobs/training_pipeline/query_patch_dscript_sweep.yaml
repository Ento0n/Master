# query_patch_dscript_sweep.yaml
program: scripts/training_pipeline/execute_pipeline.py
project: master

method: grid

metric:
  name: best_val_contact_auprc_macro
  goal: maximize

parameters:
  model:
    value: query_patch

  compatibility-head:
    value: dscript

  interaction-loss-lambda:
    value: 0.5

  loss-type:
    value: balanced_bce

  # Smaller omega values put more balanced-BCE weight on negative cells and
  # directly test whether stronger false-positive suppression improves maps.
  omega:
    values: [0.1, 0.2, 0.5]

  query-interface-loss-weight:
    value: 0.5

  interface-omega:
    value: 0.2

  trainable-final-slope:
    value: false

  max-pooling:
    value: false

  int-mod-type:
    value: normal

  # Keep the query decoder fixed at the recent four-query balanced-BCE setup
  # so this grid isolates changes caused by the new compatibility head.
  num-interaction-queries:
    value: 4

  query-heads:
    value: 4

  query-layers:
    value: 1

  query-dropout:
    value: 0.1

  query-gate-bias-init:
    value: 0.0

  # Test a stronger sparse prior because the previous maps overpredicted
  # contacts. The existing -6 initialization remains the least-sparse control.
  query-contact-bias-init:
    values: [-8.0, -7.0, -6.0]

  # Hold capacity at the D-SCRIPT reference while testing the factors most
  # directly connected to excess positive predictions.
  contact-hidden-dim:
    value: 50

  # Width 1 removes local context, width 3 tests a small neighborhood, and
  # width 7 reproduces the D-SCRIPT reference receptive field.
  contact-width:
    values: [1, 3, 7]

  max-epochs:
    value: 90

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - scripts.training_pipeline.execute_pipeline
  - ${args_no_boolean_flags}
